<article
  class="flex flex-col max-w-[90vw] max-h-[85vh] bg-white rounded-lg shadow-lg p-4 opacity-0 scale-95 transition-all duration-300 ease-in-out"
  [class.opacity-100]="!hidden() || showDialog()"
  [class.scale-100]="showDialog()"
  [style.width]="width()"
  [style.height]="height()"
>
  <header class="flex justify-between items-center mb-4 shrink-0">
    <h2 class="text-lg font-bold">{{ dialogConfig()?.title }}</h2>

    @if (dialogConfig()?.showCloseButton) {
    <ecom-button (clicked)="onClose()" variant="ghost" size="icon-sm">
      <fa-icon size="xs" [icon]="faX" />
    </ecom-button>
    }
  </header>

  <main
    class="flex-1"
    [class.overflow-auto]="!contentOverflowVisible()"
    [class.overflow-visible]="contentOverflowVisible()"
  >
    <ng-container #content></ng-container>
  </main>
</article>

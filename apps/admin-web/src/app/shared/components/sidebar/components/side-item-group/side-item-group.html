<div
  [title]="value().label"
  class="flex items-center p-2 text-base hover:cursor-pointer"
  [ngClass]="{
    'gap-3': isOpenSidebar(),
    'justify-center': !isOpenSidebar(),
  }"
  role="button"
  (click)="toggleOpenGroup()"
>
  <div class="text-primary">
    <fa-icon [icon]="value().icon" />
  </div>
  <div
    class="flex items-center gap-2 overflow-hidden transition-all duration-300"
    [ngClass]="{
      'w-0 opacity-0 whitespace-nowrap': !isOpenSidebar(),
    }"
  >
    <span>{{ value().label }}</span>
    <fa-icon
      class="transition-all ease-in-out duration-300"
      [icon]="faChevronDown"
      [ngClass]="{
        'rotate-180': isOpenGroup(),
      }"
    ></fa-icon>
  </div>
</div>
<ul
  class="grid transition-all duration-300 ease-in-out"
  [ngClass]="{
    'grid-rows-[1fr] p-2': isOpenGroup(),
    'grid-rows-[0fr]': !isOpenGroup(),
  }"
>
  <div class="overflow-hidden flex flex-col gap-2">
    <hr class="border-white" />
    @for (item of value().childrens; track $index) {
      <li class="ml-4 text-gray-600">
        <ecom-side-item-option [value]="item" [isChild]="true" />
      </li>
    }
  </div>
</ul>

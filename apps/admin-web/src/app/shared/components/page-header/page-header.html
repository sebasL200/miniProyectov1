<div class="flex flex-col gap-2 bg-transparent">
  <div>
    @if (isShowBackButton()) {
      <ecom-button class="hover:bg-transparent px-0" variant="ghost" (clicked)="goBack()">
        <fa-icon class="font-bold" [icon]="faArrowLeft" />
        <span class="text-gray-400 text-base">Volver</span>
      </ecom-button>
    }
  </div>
  <div>
    <h1 class="text-2xl font-bold">
      {{ title() }}
    </h1>
    <p class="text-base text-gray-500">
      {{ description() }}
    </p>
  </div>
</div>
<ng-content select="[slot=actions]"></ng-content>

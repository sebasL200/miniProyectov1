<ecom-page-layout [loading]="isLoading()">
    <header ecom-page-header title="Editar Categoría" description="Modifica cualquier propiedad disponible de la categoría"></header>
    <main>
        <ecom-card>
            @if (!isLoading()) {
                <ecom-category-form [initialData]="categoryFormData()" (submitted)="onSubmit($event)" (canceled)="onCanceled($event)" />
            }
        </ecom-card>
    </main>
</ecom-page-layout>

<div class="p-4">
    @if (isLoading()) {
        <div class="flex items-center justify-center py-12">
            <p class="text-gray-500">Cargando categoría...</p>
        </div>
    } @else if (isEditMode() && categoryFormData()) {
        <ecom-category-form
            [actions]="categoryFormActions()"
            [initialData]="categoryFormData()!"
            (submitted)="onSubmit($event)"
        />
    } @else if (!isEditMode()) {
        <ecom-category-form
            [actions]="categoryFormActions()"
            (submitted)="onSubmit($event)"
        />
    }
</div>

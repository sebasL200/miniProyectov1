
<ecom-card class="hover:border-primary/50! border border-transparent transition-all duration-200 cursor-pointer h-full">
  <a [routerLink]="href()" [title]="label()" class="flex flex-col items-center justify-center gap-3 text-center py-4 h-full">
    <fa-icon [icon]="icon()" class="text-3xl text-primary"></fa-icon>
    <h2 class="text-base font-semibold text-slate-800">{{ label() }}</h2>
  </a>
</ecom-card>
